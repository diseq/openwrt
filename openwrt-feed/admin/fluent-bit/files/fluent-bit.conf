# Fluent Bit native configuration.
# See https://docs.fluentbit.io/manual/administration/configuring-fluent-bit/classic-mode/configuration-file
#
# Configure real INPUT/FILTER/OUTPUT sections before enabling the service.
# The OpenWrt init script runs:
#   /usr/sbin/fluent-bit -c /etc/fluent-bit/fluent-bit.conf

[SERVICE]
    Parsers_File /etc/fluent-bit/parsers.conf
